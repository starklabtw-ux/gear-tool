<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>齒輪軸承孔工具</title>
<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #e5e5ea;
    --border-strong: #d1d1d6;
    --text: #1d1d1f;
    --muted: #86868b;
    --muted-2: #6e6e73;
    --accent: #e63946;
    --accent-dark: #c1121f;
    --accent-soft: #fdeef0;
    --blue: #0071e3;
    --success: #34c759;
    --group-bg: #fafafa;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Header ===== */
  header {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  header .sub {
    color: var(--muted);
    font-size: 12px;
    flex: 1;
  }

  /* ===== Main layout ===== */
  main {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 16px;
    padding: 16px;
    height: calc(100vh - 49px);
  }

  /* ===== Preview panels ===== */
  .previews {
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
    min-height: 0;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel-title {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text);
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
    background: var(--group-bg);
  }
  .panel-title .badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    background: #e1f0ff;
    color: var(--blue);
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .panel-title .badge.out {
    background: var(--accent-soft);
    color: var(--accent-dark);
  }
  .panel-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 12px;
    min-height: 0;
    background: repeating-linear-gradient(45deg, #fff 0 10px, #fafafa 10px 20px);
  }
  .panel.drop-on .panel-body {
    background: #eef6ff;
    outline: 2px dashed var(--blue);
    outline-offset: -8px;
  }
  .empty-msg {
    color: var(--muted);
    text-align: center;
    white-space: pre;
    font-size: 13px;
    line-height: 1.6;
  }
  .svg-box {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Fill the panel without distortion. SVG's default preserveAspectRatio
     (xMidYMid meet) keeps aspect ratio and centers the gear inside. */
  .svg-box svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .panel-body.clickable { cursor: crosshair; }

  /* ===== Controls column ===== */
  .controls {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .controls-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .controls-footer {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    background: var(--group-bg);
    border-radius: 0 0 10px 10px;
  }

  /* ===== Tabs (input source) ===== */
  .tabs {
    display: flex;
    background: var(--group-bg);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 14px;
    gap: 3px;
  }
  .tab {
    flex: 1;
    padding: 7px 10px;
    border: none;
    background: transparent;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    color: var(--muted-2);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.05), 0 0 0 0.5px rgba(0,0,0,0.04);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ===== Group (section card) ===== */
  .group {
    background: var(--group-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-top: 12px;
  }
  .group > h2 {
    margin: 0 0 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .group > h2 .group-hint {
    font-weight: 400;
    color: var(--muted);
    font-size: 11px;
    margin-left: auto;
  }

  /* details/summary styling */
  details.group > summary {
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
    list-style: none;
    user-select: none;
  }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary::after {
    content: "▸";
    margin-left: auto;
    color: var(--muted);
    transition: transform 0.15s;
    font-size: 11px;
  }
  details.group[open] > summary::after { transform: rotate(90deg); }
  details.group[open] > summary { margin-bottom: 10px; }

  /* Subsection inside group (for holes) */
  .sub {
    padding-top: 10px;
    margin-top: 10px;
    border-top: 1px dashed var(--border-strong);
  }
  .sub:first-of-type { border-top: none; padding-top: 0; margin-top: 0; }
  .sub-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted-2);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ===== Forms ===== */
  label {
    display: block;
    font-size: 12px;
    color: var(--muted-2);
    margin-bottom: 4px;
  }
  label.inline {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text);
    margin: 0;
    cursor: pointer;
  }
  label.inline input[type="checkbox"] { cursor: pointer; }
  .field { margin-bottom: 10px; }
  .field:last-child { margin-bottom: 0; }
  .row {
    display: grid;
    gap: 8px;
  }
  .row.cols-2 { grid-template-columns: 1fr 1fr; }
  .row.cols-3 { grid-template-columns: auto 1fr 1fr; align-items: end; }
  input[type="number"], input[type="text"], select {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    background: white;
    color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="number"]:focus, input[type="text"]:focus, select:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(0,113,227,0.15);
  }
  input[type="color"] {
    width: 36px;
    height: 30px;
    padding: 2px;
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    cursor: pointer;
    background: white;
  }
  input[type="file"] { display: none; }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border-strong);
    background: white;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    font-weight: 500;
    color: var(--text);
    text-align: center;
    transition: all 0.15s;
    box-sizing: border-box;
  }
  .btn:hover:not(:disabled) {
    background: #f5f5f7;
    border-color: var(--muted);
  }
  .btn-ghost {
    padding: 6px 10px;
    font-size: 12px;
    background: transparent;
    border-color: var(--border);
  }
  .btn-icon {
    width: 32px;
    flex: 0 0 32px;
    padding: 6px;
    font-size: 14px;
  }
  .btn-primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--accent-dark);
    border-color: var(--accent-dark);
  }
  .btn-primary:disabled {
    background: #d8d8dc;
    border-color: #d8d8dc;
    color: #ffffff;
    cursor: not-allowed;
  }

  /* ===== Preset row ===== */
  .preset-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .preset-row select { flex: 1; }

  /* ===== Hints ===== */
  .hint {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
    margin: 4px 0 0;
  }
  .hint.status {
    color: var(--blue);
    font-weight: 500;
  }

  code {
    background: #eef;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
    color: var(--muted-2);
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }

  /* ===== File name tag ===== */
  .file-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    background: white;
    border: 1px solid var(--border-strong);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--text);
    margin-top: 8px;
  }
  .file-tag.empty { color: var(--muted); border-style: dashed; }

  /* ===== Layer chips in footer ===== */
  .layer-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: center;
    margin-top: 8px;
  }
  .layer-chips code { font-size: 10px; }
</style>
</head>
<body>
<header>
  <h1>🦾 齒輪軸承孔工具</h1>
  <span class="sub">產生齒輪 · 加孔 · 下載分好圖層的 SVG</span>
</header>
<main>
  <!-- ===== LEFT: Previews ===== -->
  <div class="previews">
    <div class="panel" id="panelOrig">
      <div class="panel-title">
        <span>原始</span>
        <span class="badge">Before</span>
      </div>
      <div class="panel-body">
        <div class="svg-box" id="origBox"></div>
        <div class="empty-msg" id="origEmpty">拖放 SVG 到任一預覽區\A或使用右側「上傳既有」</div>
      </div>
    </div>
    <div class="panel" id="panelOut">
      <div class="panel-title">
        <span>加工後</span>
        <span class="badge out">After</span>
      </div>
      <div class="panel-body" id="outBody">
        <div class="svg-box" id="outBox"></div>
        <div class="empty-msg" id="outEmpty">載入檔案後顯示加工結果</div>
      </div>
    </div>
  </div>

  <!-- ===== RIGHT: Controls ===== -->
  <div class="controls">
    <div class="controls-scroll">

      <!-- TABS: input source -->
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="gen" type="button">⚙️ Hessmer 產生</button>
        <button class="tab" data-tab="upload" type="button">📁 上傳既有</button>
      </div>

      <!-- TAB: Generate -->
      <div class="tab-panel active" id="tab-gen">
        <div class="row cols-2">
          <div class="field">
            <label for="gmModule">模數 M</label>
            <input type="number" id="gmModule" value="1.5" step="0.1" min="0.1" />
          </div>
          <div class="field">
            <label for="gmTeeth">齒數 Z</label>
            <input type="number" id="gmTeeth" value="30" step="1" min="4" />
          </div>
        </div>
        <div class="row cols-2">
          <div class="field">
            <label for="gmAngle">壓力角</label>
            <input type="number" id="gmAngle" value="20" step="0.5" />
          </div>
          <div class="field">
            <label for="gmHole">中心孔 Ø</label>
            <input type="number" id="gmHole" value="6" step="0.1" min="0.1" />
          </div>
        </div>
        <button class="btn" id="genGearBtn" type="button">🔗 在 Hessmer 開新分頁</button>
        <p class="hint">產生後按網頁的 <code>Export SVG</code> 下載,再拖回任一預覽區</p>
      </div>

      <!-- TAB: Upload -->
      <div class="tab-panel" id="tab-upload">
        <label class="btn" for="fileInput">📁 選擇 SVG 檔案</label>
        <input type="file" id="fileInput" accept=".svg,image/svg+xml" />
        <div class="file-tag empty" id="fileName">尚未選擇檔案</div>
        <p class="hint">也可以直接把 SVG 拖到左邊任一預覽區</p>
      </div>

      <!-- ===== GROUP: Holes ===== -->
      <section class="group">
        <h2>🔩 孔設定</h2>

        <!-- Preset management inline -->
        <div class="preset-row">
          <select id="presetSelect" title="載入已存規格">
            <option value="">— 選擇已存規格 —</option>
          </select>
          <button class="btn btn-icon" id="presetSave" type="button" title="存成新的常用規格">💾</button>
          <button class="btn btn-icon" id="presetDelete" type="button" title="刪除選取規格">🗑</button>
        </div>

        <!-- Center hole -->
        <div class="sub">
          <div class="sub-title">⚫ 中心孔(軸心)</div>
          <div class="field">
            <label for="centerDia">直徑 Ø (mm)</label>
            <input type="number" id="centerDia" value="5" step="0.1" min="0.1" />
          </div>
        </div>

        <!-- Mount holes -->
        <div class="sub">
          <div class="sub-title">
            <label class="inline">
              <input type="checkbox" id="mountOn" checked />
              ⊕ 固定孔(十字 4 孔)
            </label>
          </div>
          <div class="row cols-2">
            <div class="field">
              <label for="mountDia">直徑 Ø (mm)</label>
              <input type="number" id="mountDia" value="3" step="0.1" min="0.1" />
            </div>
            <div class="field">
              <label for="mountOffset">距中心 (mm)</label>
              <input type="number" id="mountOffset" value="5" step="0.1" min="0.1" />
            </div>
          </div>
          <label class="inline" style="margin-top:4px;">
            <input type="checkbox" id="mount8" />
            改成 8 孔(加對角)
          </label>
        </div>
      </section>

      <!-- ===== GROUP: Label ===== -->
      <section class="group">
        <h2>🏷️ 標籤
          <label class="inline group-hint">
            <input type="checkbox" id="labelOn" checked /> 啟用
          </label>
        </h2>
        <div class="field">
          <label for="labelText">文字內容</label>
          <input type="text" id="labelText" value="M130" />
        </div>
        <label class="inline" style="margin-bottom:10px;">
          <input type="checkbox" id="labelAuto" checked />
          從檔名自動抓(如 <code>...mi130</code> → <code>M130</code>)
        </label>
        <div class="row cols-3">
          <div class="field">
            <label>顏色</label>
            <input type="color" id="labelColor" value="#e63946" />
          </div>
          <div class="field">
            <label for="labelSize">字大小</label>
            <input type="number" id="labelSize" value="8" step="0.5" min="1" />
          </div>
          <div class="field">
            <label for="labelOffset">上偏移 (mm)</label>
            <input type="number" id="labelOffset" value="-14" step="0.5" />
          </div>
        </div>
      </section>

      <!-- ===== GROUP: Advanced (collapsible) ===== -->
      <details class="group">
        <summary>⚙️ 進階</summary>
        <label class="inline" style="margin-bottom:4px;">
          <input type="checkbox" id="autoCenter" checked />
          自動偵測齒輪中心
        </label>
        <p class="hint">取消後,點「加工後」預覽圖可手動放置中心</p>
        <p class="hint status" id="centerInfo">未載入檔案</p>

        <label class="inline" style="margin-top:10px;">
          <input type="checkbox" id="stripRefs" checked />
          去除藍色參考線(齒頂圓 / 齒根圓)
        </label>
        <p class="hint">Hessmer 等齒輪網站產出的 SVG 常附帶參考圓</p>
      </details>

    </div>

    <!-- ===== Fixed footer: download ===== -->
    <div class="controls-footer">
      <button class="btn btn-primary" id="downloadBtn" disabled type="button">📥 下載加工 SVG</button>
      <div class="layer-chips">
        <code>Gear</code>
        <code>Bearing Hole</code>
        <code>Mounting Holes</code>
        <code>Label</code>
      </div>
    </div>
  </div>
</main>

<script>
"use strict";
const SVG_NS = "http://www.w3.org/2000/svg";

// ========== State ==========
let originalSvgText = null;
let originalFileName = null;
let center = { x: 0, y: 0 };

// ========== DOM ==========
const $ = id => document.getElementById(id);
const origBox = $("origBox");
const outBox = $("outBox");
const origEmpty = $("origEmpty");
const outEmpty = $("outEmpty");
const outBody = $("outBody");
const centerInfo = $("centerInfo");
const downloadBtn = $("downloadBtn");

// ========== Tabs ==========
document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    const name = btn.dataset.tab;
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".tab-panel").forEach(p => {
      p.classList.toggle("active", p.id === "tab-" + name);
    });
  });
});

// ========== File handling ==========
$("fileInput").addEventListener("change", e => {
  const f = e.target.files[0];
  if (f) loadFile(f);
});

// Drag & drop on both panels
["panelOrig", "panelOut"].forEach(pid => {
  const p = $(pid);
  ["dragenter", "dragover"].forEach(ev => p.addEventListener(ev, e => {
    e.preventDefault(); p.classList.add("drop-on");
  }));
  ["dragleave", "drop"].forEach(ev => p.addEventListener(ev, e => {
    e.preventDefault(); p.classList.remove("drop-on");
  }));
  p.addEventListener("drop", e => {
    const f = e.dataTransfer.files[0];
    if (f && f.name.toLowerCase().endsWith(".svg")) loadFile(f);
  });
});

function loadFile(file) {
  originalFileName = file.name;
  const tag = $("fileName");
  tag.textContent = "📎 " + file.name;
  tag.classList.remove("empty");
  const reader = new FileReader();
  reader.onload = () => {
    originalSvgText = reader.result;
    if ($("labelAuto").checked) autoFillLabel(file.name);
    renderOriginal();
    setTimeout(() => {
      if ($("autoCenter").checked) autoDetectCenter();
      renderProcessed();
    }, 0);
  };
  reader.readAsText(file);
}

function autoFillLabel(name) {
  const base = name.replace(/\.svg$/i, "");
  let m;
  if ((m = base.match(/[mM][a-zA-Z]*(\d+(?:\.\d+)?)\s*$/))) {
    $("labelText").value = "M" + m[1];
  } else if ((m = base.match(/[zZ][a-zA-Z]*(\d+(?:\.\d+)?)\s*$/))) {
    $("labelText").value = "Z" + m[1];
  } else if ((m = base.match(/([a-zA-Z])[a-zA-Z]*\s*(\d+(?:\.\d+)?)\s*$/))) {
    $("labelText").value = m[1].toUpperCase() + m[2];
  } else {
    $("labelText").value = base;
  }
}

// ========== SVG rendering ==========
function renderOriginal() {
  const parser = new DOMParser();
  const doc = parser.parseFromString(originalSvgText, "image/svg+xml");
  if (doc.querySelector("parsererror")) {
    alert("SVG 解析失敗,檔案可能損毀");
    return;
  }
  const svgEl = doc.documentElement;
  origBox.innerHTML = "";
  origBox.appendChild(svgEl);
  fitSvgToContent(svgEl);
  origEmpty.style.display = "none";
}

// Tighten the SVG's viewBox to the bounding box of its actual content.
// Hessmer's output has a viewBox spanning gear1+gear2 so a single gear
// only fills ~20% of the area. getBBox() measures the union of all
// rendered descendants in the root SVG's coordinate space.
function fitSvgToContent(svg) {
  if (!svg) return;
  try {
    const bbox = svg.getBBox();
    if (!bbox || !isFinite(bbox.width) || !isFinite(bbox.height)
        || bbox.width === 0 || bbox.height === 0) return;
    const pad = Math.max(bbox.width, bbox.height) * 0.05;
    const x = bbox.x - pad;
    const y = bbox.y - pad;
    const w = bbox.width + pad * 2;
    const h = bbox.height + pad * 2;
    svg.setAttribute("viewBox", `${x.toFixed(4)} ${y.toFixed(4)} ${w.toFixed(4)} ${h.toFixed(4)}`);
    // Update physical dimensions so Illustrator still sees mm-based size
    svg.setAttribute("width", `${w.toFixed(4)}mm`);
    svg.setAttribute("height", `${h.toFixed(4)}mm`);
  } catch (e) {
    console.warn("fitSvgToContent failed:", e);
  }
}

function buildProcessedDoc() {
  const parser = new DOMParser();
  const doc = parser.parseFromString(originalSvgText, "image/svg+xml");
  const root = doc.documentElement;

  if ($("stripRefs").checked) stripReferenceLines(root);

  const gearLayer = doc.createElementNS(SVG_NS, "g");
  gearLayer.setAttribute("id", "Gear");
  while (root.firstChild) gearLayer.appendChild(root.firstChild);
  root.appendChild(gearLayer);

  buildHoleLayers(doc).forEach(l => root.appendChild(l));
  const labelLayer = buildLabelLayer(doc);
  if (labelLayer) root.appendChild(labelLayer);
  return doc;
}

function renderProcessed() {
  if (!originalSvgText) return;
  const doc = buildProcessedDoc();
  const svgEl = doc.documentElement;
  outBox.innerHTML = "";
  outBox.appendChild(svgEl);
  fitSvgToContent(svgEl);
  outEmpty.style.display = "none";
  downloadBtn.disabled = false;
}

function buildHoleLayers(doc) {
  const layers = [];
  const centerDia = parseFloat($("centerDia").value) || 5;
  const strokeW = getSuggestedStrokeWidth();

  const bearing = doc.createElementNS(SVG_NS, "g");
  bearing.setAttribute("id", "Bearing Hole");
  bearing.setAttribute("fill", "none");
  bearing.setAttribute("stroke", "black");
  bearing.setAttribute("stroke-width", String(strokeW));
  const c1 = doc.createElementNS(SVG_NS, "circle");
  c1.setAttribute("cx", center.x.toFixed(4));
  c1.setAttribute("cy", center.y.toFixed(4));
  c1.setAttribute("r", (centerDia / 2).toFixed(4));
  bearing.appendChild(c1);
  layers.push(bearing);

  if ($("mountOn").checked) {
    const mountDia = parseFloat($("mountDia").value) || 3;
    const offset = parseFloat($("mountOffset").value) || 5;
    const mount = doc.createElementNS(SVG_NS, "g");
    mount.setAttribute("id", "Mounting Holes");
    mount.setAttribute("fill", "none");
    mount.setAttribute("stroke", "black");
    mount.setAttribute("stroke-width", String(strokeW));

    const positions = [[0, -offset], [0, offset], [-offset, 0], [offset, 0]];
    if ($("mount8").checked) {
      const s = offset / Math.SQRT2;
      positions.push([s, -s], [-s, -s], [s, s], [-s, s]);
    }
    positions.forEach(([dx, dy]) => {
      const c = doc.createElementNS(SVG_NS, "circle");
      c.setAttribute("cx", (center.x + dx).toFixed(4));
      c.setAttribute("cy", (center.y + dy).toFixed(4));
      c.setAttribute("r", (mountDia / 2).toFixed(4));
      mount.appendChild(c);
    });
    layers.push(mount);
  }
  return layers;
}

function buildLabelLayer(doc) {
  if (!$("labelOn").checked) return null;
  const text = $("labelText").value.trim();
  if (!text) return null;

  const layer = doc.createElementNS(SVG_NS, "g");
  layer.setAttribute("id", "Label");

  const t = doc.createElementNS(SVG_NS, "text");
  const size = parseFloat($("labelSize").value) || 8;
  const offset = parseFloat($("labelOffset").value) || -14;
  const color = $("labelColor").value || "#e63946";

  t.setAttribute("x", center.x.toFixed(4));
  t.setAttribute("y", (center.y + offset).toFixed(4));
  t.setAttribute("fill", color);
  t.setAttribute("font-size", String(size));
  t.setAttribute("font-family", "Arial, Helvetica, sans-serif");
  t.setAttribute("text-anchor", "middle");
  t.setAttribute("dominant-baseline", "middle");
  t.textContent = text;
  layer.appendChild(t);
  return layer;
}

function stripReferenceLines(svgRoot) {
  svgRoot.querySelectorAll('[stroke="blue"]').forEach(el => el.remove());
  svgRoot.querySelectorAll('[style]').forEach(el => {
    const s = (el.getAttribute("style") || "").replace(/\s+/g, "");
    if (/stroke:blue/i.test(s) || /stroke:#00f/i.test(s) || /stroke:#0000ff/i.test(s)) el.remove();
  });
}

function getSuggestedStrokeWidth() {
  const svg = origBox.querySelector("svg");
  if (!svg) return 0.2;
  const vb = (svg.getAttribute("viewBox") || "").split(/\s+/).map(parseFloat);
  if (vb.length === 4) {
    const maxDim = Math.max(vb[2], vb[3]);
    return Math.max(0.1, maxDim / 1000);
  }
  return 0.2;
}

// ========== Center detection ==========
function autoDetectCenter() {
  const svg = origBox.querySelector("svg");
  if (!svg) return;
  const circles = svg.querySelectorAll("circle");
  let best = null;
  let bestR = Infinity;
  circles.forEach(c => {
    const r = parseFloat(c.getAttribute("r") || "0");
    if (r >= 0.5 && r < bestR) { bestR = r; best = c; }
  });
  if (best) {
    const cx = parseFloat(best.getAttribute("cx") || "0");
    const cy = parseFloat(best.getAttribute("cy") || "0");
    const p = localToUserSpace(best, svg, cx, cy);
    center.x = p.x;
    center.y = p.y;
    centerInfo.textContent = `偵測到中心:r=${bestR.toFixed(2)} @ (${center.x.toFixed(2)}, ${center.y.toFixed(2)})`;
  } else {
    const vb = (svg.getAttribute("viewBox") || "0 0 100 100").split(/\s+/).map(parseFloat);
    center.x = vb[0] + vb[2] / 2;
    center.y = vb[1] + vb[3] / 2;
    centerInfo.textContent = `未找到圓,使用 viewBox 中心`;
  }
}

function localToUserSpace(element, rootSvg, localX, localY) {
  let matrix = rootSvg.createSVGMatrix();
  let curr = element;
  while (curr && curr !== rootSvg) {
    const t = curr.transform && curr.transform.baseVal;
    if (t && t.numberOfItems > 0) {
      try {
        const consolidated = t.consolidate();
        if (consolidated && consolidated.matrix) {
          matrix = consolidated.matrix.multiply(matrix);
        }
      } catch (e) { /* ignore */ }
    }
    curr = curr.parentNode;
  }
  const pt = rootSvg.createSVGPoint();
  pt.x = localX; pt.y = localY;
  return pt.matrixTransform(matrix);
}

// ========== Manual center override ==========
outBody.addEventListener("click", e => {
  if ($("autoCenter").checked) return;
  const svg = outBox.querySelector("svg");
  if (!svg) return;
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const ctm = svg.getScreenCTM();
  if (!ctm) return;
  const p = pt.matrixTransform(ctm.inverse());
  center.x = p.x;
  center.y = p.y;
  centerInfo.textContent = `手動設定:(${center.x.toFixed(2)}, ${center.y.toFixed(2)})`;
  renderProcessed();
});

$("autoCenter").addEventListener("change", () => {
  outBody.classList.toggle("clickable", !$("autoCenter").checked);
  if ($("autoCenter").checked && originalSvgText) {
    setTimeout(() => { autoDetectCenter(); renderProcessed(); }, 0);
  }
});

// ========== Live controls ==========
const liveInputs = [
  "centerDia", "mountDia", "mountOffset", "mountOn", "mount8",
  "labelOn", "labelText", "labelColor", "labelSize", "labelOffset",
  "stripRefs"
];
liveInputs.forEach(id => {
  const el = $(id);
  el.addEventListener("input", renderProcessed);
  el.addEventListener("change", renderProcessed);
});

// ========== Preset storage ==========
const PRESET_KEY = "gear-tool-presets-v1";

function loadPresets() {
  try { return JSON.parse(localStorage.getItem(PRESET_KEY) || "[]"); }
  catch { return []; }
}
function savePresets(arr) {
  localStorage.setItem(PRESET_KEY, JSON.stringify(arr));
}
function refreshPresetDropdown() {
  const sel = $("presetSelect");
  const presets = loadPresets();
  const prev = sel.value;
  sel.innerHTML = '<option value="">— 選擇已存規格 —</option>' +
    presets.map((p, i) => `<option value="${i}">${escapeHtml(p.name)} · 中心Ø${p.centerDia} / 固定Ø${p.mountDia}@${p.mountOffset}mm</option>`).join("");
  if (prev && sel.querySelector(`option[value="${prev}"]`)) sel.value = prev;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function currentSettingsSnapshot() {
  return {
    centerDia: parseFloat($("centerDia").value) || 5,
    mountOn: $("mountOn").checked,
    mountDia: parseFloat($("mountDia").value) || 3,
    mountOffset: parseFloat($("mountOffset").value) || 5,
    mount8: $("mount8").checked,
  };
}
function applyPreset(p) {
  $("centerDia").value = p.centerDia;
  $("mountOn").checked = !!p.mountOn;
  $("mountDia").value = p.mountDia;
  $("mountOffset").value = p.mountOffset;
  $("mount8").checked = !!p.mount8;
  renderProcessed();
}

$("presetSelect").addEventListener("change", e => {
  const idx = parseInt(e.target.value, 10);
  const presets = loadPresets();
  if (!isNaN(idx) && presets[idx]) applyPreset(presets[idx]);
});

$("presetSave").addEventListener("click", () => {
  const defaultName = `Ø${$("centerDia").value} / 固定Ø${$("mountDia").value}`;
  const name = prompt("幫這組規格取個名字(例:「小齒輪 Ø5」):", defaultName);
  if (!name || !name.trim()) return;
  const presets = loadPresets();
  const entry = { name: name.trim(), ...currentSettingsSnapshot() };
  const existing = presets.findIndex(p => p.name === entry.name);
  if (existing >= 0) {
    if (!confirm(`已有叫「${entry.name}」的規格,要覆蓋嗎?`)) return;
    presets[existing] = entry;
  } else {
    presets.push(entry);
  }
  savePresets(presets);
  refreshPresetDropdown();
  const newIdx = presets.findIndex(p => p.name === entry.name);
  $("presetSelect").value = String(newIdx);
});

$("presetDelete").addEventListener("click", () => {
  const idx = parseInt($("presetSelect").value, 10);
  const presets = loadPresets();
  if (isNaN(idx) || !presets[idx]) {
    alert("先在下拉選單選一個規格再刪除");
    return;
  }
  if (!confirm(`確定刪除「${presets[idx].name}」?`)) return;
  presets.splice(idx, 1);
  savePresets(presets);
  refreshPresetDropdown();
});

refreshPresetDropdown();

$("labelAuto").addEventListener("change", () => {
  if ($("labelAuto").checked && originalFileName) {
    autoFillLabel(originalFileName);
    renderProcessed();
  }
});

// ========== Gear generator shortcut (Hessmer) ==========
$("genGearBtn").addEventListener("click", () => {
  const m = parseFloat($("gmModule").value) || 1;
  const z = parseInt($("gmTeeth").value, 10) || 30;
  const angle = parseFloat($("gmAngle").value) || 20;
  const hole = parseFloat($("gmHole").value) || 6;
  const circularPitch = (m * Math.PI).toFixed(4);
  const params = new URLSearchParams({
    circularPitch,
    pressureAngle: String(angle),
    clearance: "0.05",
    backlash: "0.05",
    profileShift: "0",
    gear1ToothCount: String(z),
    gear1CenterHoleDiamater: String(hole),
    gear2ToothCount: "10",
    gear2CenterHoleDiamater: String(hole),
    showOption: "3"
  });
  const url = "https://hessmer.org/gears/InvoluteSpurGearBuilder.html?" + params.toString();
  window.open(url, "_blank", "noopener");
});

// ========== Download ==========
downloadBtn.addEventListener("click", () => {
  const svg = outBox.querySelector("svg");
  if (!svg) return;
  // Serialize the currently-rendered (viewBox-tightened) SVG directly
  // so the downloaded file matches exactly what the user sees.
  const serializer = new XMLSerializer();
  let out = serializer.serializeToString(svg);
  if (!out.startsWith("<?xml")) {
    out = '<?xml version="1.0" encoding="UTF-8"?>\n' + out;
  }
  const blob = new Blob([out], { type: "image/svg+xml" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const base = (originalFileName || "gear").replace(/\.svg$/i, "");
  a.href = url;
  a.download = base + "_drilled.svg";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});
</script>
</body>
